version: 2

project_name: yaktui

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: yaktui
    repository:
      owner: vmsilvamolina
      name: homebrew-yaktui
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/vmsilvamolina/yaktui
    description: Yet Another Kubernetes TUI — minimal k8s dashboard inspired by k9s
    license: MIT
    install: |
      bin.install "yaktui"
    test: |
      system "#{bin}/yaktui", "--version"
